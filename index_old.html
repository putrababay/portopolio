<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SI-PROJECTS | Portofolio Sistem Informasi Premium</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --primary-gradient: linear-gradient(
          135deg,
          #007bff 0%,
          #6610f2 50%,
          #6f42c1 100%
        );
        --custom-blue: #5d5fef;
        --whatsapp-green: #25d366;
      }

      body {
        font-family: "Poppins", sans-serif;
        background-color: #f4f7f6;
        color: #333;
      }

      /* Navbar */
      .navbar-brand {
        font-size: 1.5rem;
        letter-spacing: 1px;
      }

      /* Hero Slider */
      .carousel-item {
        height: 60vh;
        min-height: 400px;
        background-size: cover;
        background-position: center;
      }
      .carousel-caption {
        bottom: 20%;
        background: rgba(0, 0, 0, 0.4);
        padding: 20px;
        border-radius: 15px;
        backdrop-filter: blur(5px);
      }
      .carousel-title {
        font-size: 3rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      /* Search Section */
      .search-section {
        background-color: #fff;
        padding: 30px 0;
        margin-top: -50px;
        position: relative;
        z-index: 10;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }

      /* Card Styling */
      .project-card {
        border: none;
        border-radius: 15px;
        transition: all 0.3s ease;
        overflow: hidden;
        background: #fff;
      }
      .project-card:hover {
        transform: translateY(-10px);
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
      }

      .card-img-container {
        background: #212529;
        padding: 30px;
        height: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      .card-img-container img {
        max-width: 100%;
        max-height: 100%;
        border-radius: 5px;
      }

      .btn-whatsapp-card {
        position: absolute;
        top: 10px;
        right: 10px;
        background: var(--whatsapp-green);
        color: white;
        border-radius: 50%;
        width: 35px;
        height: 35px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
      }

      .btn-custom-blue {
        background: var(--custom-blue);
        color: white;
        border-radius: 20px;
      }
      .btn-custom-blue:hover {
        background: #4a4cd9;
        color: white;
      }
      .btn-outline-custom {
        border: 2px solid #eee;
        border-radius: 20px;
        color: #555;
      }

      /* Modal Thumbnails */
      .modal-thumbnails img {
        width: 60px;
        height: 60px;
        object-fit: cover;
        border-radius: 8px;
        cursor: pointer;
        border: 2px solid transparent;
      }
      .modal-thumbnails img.active {
        border-color: var(--custom-blue);
      }

      footer {
        background-color: #1a1d21;
      }
    </style>
  </head>
  <body>
    <nav
      class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm"
    >
      <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="#"
          ><i class="bi bi-cpu-fill me-2"></i>SI-PROJECTS</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto fw-semibold">
            <li class="nav-item">
              <a class="nav-link text-primary" href="#">BERANDA</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">PORTOFOLIO</a>
            </li>
            <li class="nav-item"><a class="nav-link" href="#">KONTAK</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <div
      id="heroCarousel"
      class="carousel slide carousel-fade"
      data-bs-ride="carousel"
    >
      <div class="carousel-inner">
        <div
          class="carousel-item active"
          style="
            background-image: url(&quot;https://images.unsplash.com/photo-1517694712202-14dd9538aa97?q=80&w=1920&auto=format&fit=crop&quot;);
          "
        >
          <div class="carousel-caption text-start">
            <h1 class="carousel-title">PORTOFOLIO<br />SISTEM INFORMASI</h1>
            <p class="lead">Inovasi Digital Terintegrasi untuk Bisnis Anda.</p>
          </div>
        </div>
      </div>
    </div>

    <section class="search-section container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <div class="input-group input-group-lg">
            <span class="input-group-text bg-white border-0 text-muted"
              ><i class="bi bi-search"></i
            ></span>
            <input
              type="text"
              class="form-control border-0"
              placeholder="Cari nama projek..."
            />
            <button class="btn btn-custom-blue px-4 ms-2">Cari</button>
          </div>
        </div>
      </div>
    </section>

    <div class="container my-5">
      <h2 class="text-center fw-bold mb-5">GALERI PROJEK</h2>
      <div
        class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4"
        id="projectContainer"
      ></div>
    </div>

    <div
      class="modal fade"
      id="dynamicProjectModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content shadow-lg">
          <div class="modal-header border-0">
            <h5 class="modal-title fw-bold" id="modalTitle">Judul Projek</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <div class="row">
              <div class="col-md-7 text-center">
                <div class="modal-preview-main p-3 bg-dark rounded-3 mb-3">
                  <img
                    src=""
                    id="mainModalImage"
                    class="img-fluid rounded shadow"
                  />
                </div>
                <div
                  id="modalThumbnails"
                  class="modal-thumbnails d-flex justify-content-center gap-2"
                ></div>
              </div>
              <div class="col-md-5">
                <h6 class="fw-semibold text-primary">Deskripsi</h6>
                <p class="small text-muted" id="modalDesc"></p>
                <h6 class="fw-semibold text-primary mt-3">Fitur Unggulan</h6>
                <ul class="small text-muted ps-3" id="modalFeatures"></ul>
                <h6 class="fw-semibold text-primary mt-3">Teknologi</h6>
                <div id="modalTech"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <footer class="text-white py-5 mt-5">
      <div class="container text-center">
        <p class="small text-secondary">
          Crafted with <i class="bi bi-heart-fill text-danger"></i> &copy; 2026
          SI-PROJECTS
        </p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      const projectsData = [
        {
          id: 1,
          title: "SMART INVENTORY SYSTEM",
          short_desc: "Manajemen stok barang real-time dengan barcode.",
          full_desc:
            "Sistem pelacakan stok barang menggunakan Barcode/QR Code untuk akurasi data real-time.",
          features: [
            "Scan Barcode",
            "Laporan Stok Otomatis",
            "Manajemen Supplier",
          ],
          tech: ["PHP 8.2", "Laravel 10", "MySQL"],
          // Menggunakan Unsplash sebagai pengganti placeholder yang error
          image:
            "https://images.unsplash.com/photo-1586769852044-692d6e3703f0?q=80&w=500&auto=format&fit=crop",
          gallery: [
            "https://images.unsplash.com/photo-1586769852044-692d6e3703f0?q=80&w=500&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1553413077-190dd305871c?q=80&w=500&auto=format&fit=crop",
          ],
        },
        {
          id: 2,
          title: "HOSPITAL MANAGEMENT",
          short_desc: "Sistem rekam medis digital terintegrasi.",
          full_desc:
            "Aplikasi rekam medis elektronik untuk mempermudah pendaftaran dan diagnosa pasien.",
          features: ["E-Medical Record", "Antrian Online", "Integrasi BPJS"],
          tech: ["CodeIgniter 4", "Bootstrap 5", "MySQL"],
          image:
            "https://images.unsplash.com/photo-1516549655169-df83a0774514?q=80&w=500&auto=format&fit=crop",
          gallery: [
            "https://images.unsplash.com/photo-1516549655169-df83a0774514?q=80&w=500&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1576091160550-2173dba999ef?q=80&w=500&auto=format&fit=crop",
          ],
        },
      ];
      // Fungsi me-render card secara otomatis ke HTML
      function renderCards() {
        const container = document.getElementById("projectContainer");
        container.innerHTML = projectsData
          .map(
            (p) => `
          <div class="col">
            <div class="card h-100 project-card text-center shadow-sm">
              <div class="card-img-container">
                <a href="https://wa.me/628123456789" class="btn-whatsapp-card" target="_blank"><i class="bi bi-whatsapp"></i></a>
                <img src="${p.image}" alt="${p.title}" />
              </div>
              <div class="card-body p-3 d-flex flex-column">
                <h6 class="fw-bold mb-1 small">${p.title}</h6>
                <p class="text-muted small mb-3 flex-grow-1">${p.short_desc}</p>
                <div class="d-grid gap-2">
                  <button class="btn btn-custom-blue btn-sm" onclick="showDetail(${p.id})"><i class="bi bi-eye"></i> DETAIL</button>
                  <button class="btn btn-outline-custom btn-sm"><i class="bi bi-link-45deg"></i> DEMO</button>
                </div>
              </div>
            </div>
          </div>
        `,
          )
          .join("");
      }

      // Inisialisasi modal sekali saja di luar fungsi
      let projectModal;
      window.addEventListener("DOMContentLoaded", () => {
        projectModal = new bootstrap.Modal(
          document.getElementById("dynamicProjectModal"),
        );
        renderCards(); // Panggil render card setelah modal siap
      });

      function showDetail(id) {
        const p = projectsData.find((item) => item.id === id);
        if (!p) return;

        // Update isi modal
        document.getElementById("modalTitle").innerText = p.title;
        document.getElementById("modalDesc").innerText = p.full_desc;
        document.getElementById("mainModalImage").src = p.image;

        // Update fitur
        const featuresList = p.features.map((f) => `<li>${f}</li>`).join("");
        document.getElementById("modalFeatures").innerHTML = featuresList;

        // Update teknologi
        const techBadges = p.tech
          .map(
            (t) =>
              `<span class="badge bg-light text-primary me-1 border">${t}</span>`,
          )
          .join("");
        document.getElementById("modalTech").innerHTML = techBadges;

        // Update gallery thumbnails
        const thumbBox = document.getElementById("modalThumbnails");
        thumbBox.innerHTML = p.gallery
          .map(
            (img) => `
    <img src="${img}" style="width:60px; height:60px; object-fit:cover; cursor:pointer; border-radius:5px;" 
         onclick="document.getElementById('mainModalImage').src='${img}'" />
  `,
          )
          .join("");

        // Tampilkan modal yang sudah di-init
        projectModal.show();
      }

      function changeMainImage(imgElement) {
        document.getElementById("mainModalImage").src = imgElement.src;
        document
          .querySelectorAll(".modal-thumbnails img")
          .forEach((img) => img.classList.remove("active"));
        imgElement.classList.add("active");
      }

      // Jalankan render saat halaman siap
      window.onload = renderCards;
    </script>
  </body>
</html>
