<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SI-PROJECTS | Portofolio Sistem Informasi Premium</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
      :root {
        --primary-gradient: linear-gradient(
          135deg,
          #007bff 0%,
          #6610f2 50%,
          #6f42c1 100%
        );
        --custom-blue: #5d5fef;
        --whatsapp-green: #25d366;
      }

      body {
        font-family: "Poppins", sans-serif;
        background-color: #f4f7f6;
        color: #333;
        scroll-behavior: smooth;
      }

      .navbar-brand {
        font-size: 1.5rem;
        letter-spacing: 1px;
      }

      /* Hero Slider */
      .carousel-item {
        height: 60vh;
        min-height: 400px;
        background-repeat: no-repeat;
        background-position: center center;
        background-size: cover;
      }

      .carousel-caption {
        bottom: 20%;
        background: rgba(0, 0, 0, 0.4);
        padding: 20px;
        border-radius: 15px;
        backdrop-filter: blur(5px);
      }

      .carousel-title {
        font-size: 3.5rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 3px;
        line-height: 1.2;
      }

      /* Search Section */
      .search-section {
        background-color: #fff;
        padding: 30px 0;
        margin-top: -50px;
        position: relative;
        z-index: 10;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }

      .search-input {
        border-radius: 30px;
        padding-left: 20px;
        border: 2px solid #eee;
      }

      /* Project Grid */
      .section-title {
        font-weight: 700;
        margin: 60px 0 40px;
        text-transform: uppercase;
        position: relative;
        display: inline-block;
      }
      .section-title::after {
        content: "";
        display: block;
        width: 60px;
        height: 4px;
        background: var(--custom-blue);
        margin: 10px auto 0;
        border-radius: 2px;
      }

      .project-card {
        border: none;
        border-radius: 15px;
        transition: all 0.3s ease;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        overflow: hidden;
        background: #fff;
      }
      .project-card:hover {
        transform: translateY(-10px);
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
      }

      .card-img-container {
        background: #212529;
        height: 220px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }
      .card-img-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.5s;
      }
      .project-card:hover .card-img-container img {
        transform: scale(1.1);
      }

      .btn-whatsapp-card {
        position: absolute;
        top: 15px;
        right: 15px;
        background-color: var(--whatsapp-green);
        color: white;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.3rem;
        text-decoration: none;
        z-index: 5;
      }

      .btn-custom-blue {
        background-color: var(--custom-blue);
        color: white;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 600;
      }

      footer {
        background-color: #1a1d21;
      }

      @media (max-width: 768px) {
        .carousel-item {
          height: 50vh;
          min-height: 300px;
        }
        .carousel-title {
          font-size: 1.8rem !important;
        }
      }
    </style>
  </head>
  <body>
    <nav
      class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm"
    >
      <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="#">
          <i class="bi bi-cpu-fill me-2"></i>SI-PROJECTS
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto fw-semibold">
            <li class="nav-item">
              <a class="nav-link" href="#heroCarousel">BERANDA</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#galeri">PORTOFOLIO</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#kontak">KONTAK</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div
      id="heroCarousel"
      class="carousel slide carousel-fade"
      data-bs-ride="carousel"
    >
      <div class="carousel-inner">
        <div
          class="carousel-item active"
          style="
            background-image: url(&quot;https://images.unsplash.com/photo-1517694712202-14dd9538aa97?q=80&w=1920&auto=format&fit=crop&quot;);
          "
        >
          <div class="carousel-caption text-start">
            <h1 class="carousel-title">PORTOFOLIO<br />SISTEM INFORMASI</h1>
            <p class="lead">
              Inovasi Digital Terintegrasi untuk Masa Depan Bisnis Anda.
            </p>
          </div>
        </div>
      </div>
    </div>

    <section class="search-section">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-8 col-lg-6">
            <div class="input-group input-group-lg shadow-sm">
              <span
                class="input-group-text bg-white border-0 text-muted fs-4 pe-0"
                ><i class="bi bi-search ms-2"></i
              ></span>
              <input
                type="text"
                id="searchInput"
                class="form-control search-input border-0 bg-white"
                placeholder="Cari nama projek atau teknologi..."
              />
            </div>
          </div>
        </div>
      </div>
    </section>

    <div class="container my-5" id="galeri">
      <div class="text-center">
        <h2 class="section-title">GALERI PROJEK</h2>
      </div>
      <div
        class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-4 mt-2"
        id="projectContainer"
      ></div>
    </div>

    <footer class="text-white py-5 mt-5" id="kontak">
      <div class="container text-center">
        <h5 class="fw-bold mb-3 text-primary">SI-PROJECTS</h5>
        <p class="small mb-0 text-secondary">
          Crafted with <i class="bi bi-heart-fill text-danger"></i> by Bayu
          Anggara &copy; 2026
        </p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      const WORKER_URL = "https://d1-rest.bayuanggara-bp.workers.dev";
      const projectContainer = document.getElementById("projectContainer");
      const searchInput = document.getElementById("searchInput");
      let allProjects = [];

      // --- 1. KONEKSI KE WORKER (GET DATA) ---
      async function loadProjects() {
        try {
          projectContainer.innerHTML = `<div class="col-12 text-center py-5"><div class="spinner-border text-primary"></div></div>`;

          const res = await fetch(WORKER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              sql: "SELECT * FROM projek ORDER BY id DESC",
            }),
          });
          const json = await res.json();

          if (json.success) {
            allProjects = json.results;
            renderProjects(allProjects);
          }
        } catch (e) {
          console.error("Gagal memuat data:", e);
          projectContainer.innerHTML = `<div class="col-12 text-center text-danger">Gagal memuat database D1.</div>`;
        }
      }

      // --- 2. HELPER: CONVERT BLOB/BUFFER TO BASE64 ---
      function arrayBufferToBase64(buffer) {
        if (!buffer) return null;
        let binary = "";
        const bytes = new Uint8Array(buffer);
        for (let i = 0; i < bytes.byteLength; i++)
          binary += String.fromCharCode(bytes[i]);
        return btoa(binary);
      }

      // --- 3. RENDER CARDS ---
      function renderProjects(data) {
        projectContainer.innerHTML = "";
        if (data.length === 0) {
          projectContainer.innerHTML = `<div class="col-12 text-center py-5 text-muted">Projek tidak ditemukan.</div>`;
          return;
        }

        data.forEach((p) => {
          const b64 = arrayBufferToBase64(p.img1);
          const imgSrc = b64
            ? `data:image/jpeg;base64,${b64}`
            : "https://via.placeholder.com/400x250?text=No+Image";
          const waLink = `https://wa.me/628123456789?text=Halo, saya tertarik dengan projek: ${encodeURIComponent(p.nm_projek)}`;

          projectContainer.innerHTML += `
            <div class="col">
              <div class="card h-100 project-card shadow-sm">
                <div class="card-img-container">
                  <a href="${waLink}" class="btn-whatsapp-card" target="_blank"><i class="bi bi-whatsapp"></i></a>
                  <img src="${imgSrc}" alt="${p.nm_projek}">
                </div>
                <div class="card-body p-3 d-flex flex-column text-center">
                  <h6 class="fw-bold mb-1">${p.nm_projek}</h6>
                  <div class="flex-grow-1 small text-muted mb-3">${p.title.replace(/<[^>]*>?/gm, "").substring(0, 50)}...</div>
                  <button class="btn btn-custom-blue btn-sm w-100" onclick="showDetail(${p.id})">
                    <i class="bi bi-eye me-1"></i> DETAIL
                  </button>
                </div>
              </div>
            </div>`;
        });
      }

      // --- 4. LIVE SEARCH ---
      searchInput.addEventListener("input", (e) => {
        const keyword = e.target.value.toLowerCase();
        const filtered = allProjects.filter(
          (p) =>
            p.nm_projek.toLowerCase().includes(keyword) ||
            p.teknologi.toLowerCase().includes(keyword),
        );
        renderProjects(filtered);
      });

      // --- 5. DETAIL POPUP (SweetAlert2) ---
      async function showDetail(id) {
        const p = allProjects.find((item) => item.id === id);
        if (!p) return;

        let techs = [];
        try {
          techs = JSON.parse(p.teknologi);
        } catch (e) {}

        const images = [];
        for (let i = 1; i <= 5; i++) {
          const b64 = arrayBufferToBase64(p[`img${i}`]);
          if (b64) images.push(`data:image/jpeg;base64,${b64}`);
        }

        Swal.fire({
          title: p.nm_projek,
          html: `
            <div class="text-start">
              <div class="mb-3">${p.deskripsi}</div>
              <div class="mb-3"><strong>Fitur:</strong><br>${p.fitur}</div>
              <div class="mb-3">
                ${techs.map((t) => `<span class="badge bg-primary me-1">${t}</span>`).join("")}
              </div>
              <div class="row g-2">
                ${images.map((img) => `<div class="col-4"><img src="${img}" class="img-fluid rounded border"></div>`).join("")}
              </div>
            </div>
          `,
          width: "700px",
          showCloseButton: true,
          confirmButtonText: "Tutup",
        });
      }

      // Inisialisasi
      loadProjects();
    </script>
  </body>
</html>
