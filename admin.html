<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel - Portofolio Bayu</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet" />
    <link
      href="https://cdn.quilljs.com/1.3.6/quill.snow.css"
      rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <style>
      body {
        background-color: #f4f7f6;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      .card {
        border: none;
        border-radius: 12px;
      }
      .ql-container {
        height: 120px;
        border-bottom-left-radius: 8px;
        border-bottom-right-radius: 8px;
      }
      .ql-toolbar {
        border-top-left-radius: 8px;
        border-top-right-radius: 8px;
      }

      .img-upload-box {
        border: 2px dashed #dee2e6;
        border-radius: 12px;
        background: #fdfdfd;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        height: 130px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .img-upload-box:hover {
        border-color: #0d6efd;
        background: #f8fbff;
      }
      .preview-img-full {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 5;
        background: #fff;
      }

      .action-btns-container {
        position: absolute;
        top: 5px;
        right: 5px;
        z-index: 10;
        display: none;
        gap: 5px;
      }
      .thumb-img.active {
        border: 3px solid #0d6efd !important;
      }

      @media (max-width: 768px) {
        .d-flex-mobile {
          flex-direction: column !important;
          align-items: flex-start !important;
          gap: 15px;
        }
        .btn-full-mobile {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container-fluid py-4 px-lg-5">
      <div
        class="d-flex justify-content-between align-items-center mb-4 d-flex-mobile">
        <div>
          <h2 class="fw-bold mb-0 text-dark">
            <i class="bi bi-speedometer2 me-2"></i>Project Console
          </h2>
          <small class="text-muted">Kelola data portofolio Bayu Anggara</small>
        </div>
        <div class="d-flex gap-2 btn-full-mobile">
          <div class="input-group shadow-sm">
            <span class="input-group-text bg-white border-end-0"
              ><i class="bi bi-search"></i
            ></span>
            <input
              type="text"
              id="searchInput"
              class="form-control border-start-0"
              placeholder="Cari projek..."
              onkeyup="filterTable()" />
          </div>
          <button
            class="btn btn-primary px-4 shadow-sm text-nowrap"
            onclick="openModal()">
            <i class="bi bi-plus-lg me-2"></i>Tambah
          </button>
        </div>
      </div>

      <div class="card shadow-sm">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table
              class="table table-hover align-middle mb-0"
              id="projectTable">
              <thead class="bg-light text-secondary">
                <tr>
                  <th class="ps-4">No</th>
                  <th>Nama Projek</th>
                  <th>Tahun</th>
                  <th>Judul Singkat</th>
                  <th>Teknologi</th>
                  <th>Akses Link</th>
                  <th>Preview</th>
                  <th class="text-center">Aksi</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="projekModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-xl">
        <div class="modal-content border-0 shadow">
          <form id="projekForm">
            <div class="modal-header bg-light">
              <h5 class="modal-title fw-bold" id="modalTitle">
                Konfigurasi Projek
              </h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <input type="hidden" name="id" id="projekId" />
              <div class="row g-4">
                <div class="col-lg-7">
                  <div class="row">
                    <div class="col-md-8 mb-3">
                      <label class="form-label fw-semibold"
                        ><i class="bi bi-tag me-1 text-primary"></i> Nama
                        Projek</label
                      >
                      <input
                        type="text"
                        name="nm_projek"
                        class="form-control"
                        placeholder="Nama Projek..."
                        required />
                    </div>
                    <div class="col-md-4 mb-3">
                      <label class="form-label fw-semibold"
                        ><i class="bi bi-calendar-event me-1 text-primary"></i>
                        Tahun</label
                      >
                      <input
                        type="number"
                        name="tahun"
                        class="form-control"
                        placeholder="2024"
                        required />
                    </div>
                  </div>
                  <div class="mb-3">
                    <label class="form-label fw-semibold"
                      ><i class="bi bi-fonts me-1 text-primary"></i> Short
                      Title</label
                    >
                    <div id="editor-title"></div>
                  </div>
                  <div class="row">
                    <div class="col-md-6 mb-3">
                      <label class="form-label fw-semibold"
                        ><i class="bi bi-card-text me-1 text-primary"></i>
                        Deskripsi</label
                      >
                      <div id="editor-deskripsi"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                      <label class="form-label fw-semibold"
                        ><i class="bi bi-list-check me-1 text-primary"></i>
                        Fitur Utama</label
                      >
                      <div id="editor-fitur"></div>
                    </div>
                  </div>
                </div>
                <div class="col-lg-5 border-start">
                  <div class="mb-4">
                    <label class="form-label fw-semibold"
                      ><i class="bi bi-link-45deg me-1 text-primary"></i> Tautan
                      Media</label
                    >
                    <div class="input-group mb-2">
                      <span class="input-group-text"
                        ><i class="bi bi-globe"></i></span
                      ><input
                        type="url"
                        name="link"
                        class="form-control"
                        placeholder="URL Demo Web" />
                    </div>
                    <div class="input-group">
                      <span class="input-group-text text-danger"
                        ><i class="bi bi-youtube"></i></span
                      ><input
                        type="text"
                        name="youtube"
                        class="form-control"
                        placeholder="ID YouTube" />
                    </div>
                  </div>
                  <div class="mb-3">
                    <label
                      class="form-label fw-semibold d-flex justify-content-between">
                      <span
                        ><i class="bi bi-cpu me-1 text-primary"></i> Tech
                        Stack</span
                      >
                      <button
                        type="button"
                        class="btn btn-sm btn-outline-primary py-0"
                        onclick="addTechField()">
                        + Tambah
                      </button>
                    </label>
                    <div id="tech-container" class="row row-cols-2 g-2"></div>
                  </div>
                  <hr />
                  <label class="form-label fw-bold"
                    ><i class="bi bi-images me-1 text-primary"></i> Gallery
                    (Klik ikon mata untuk preview)</label
                  >
                  <div class="row row-cols-3 g-2">
                    <script>
                      for (let i = 1; i <= 5; i++) {
                        document.write(`
                          <div class="col">
                            <div class="img-upload-box mb-1" id="box-img${i}" onclick="triggerFileInput(${i})">
                              <i class="bi bi-plus-circle text-muted placeholder-icon"></i>
                              <img id="prev-img${i}" class="preview-img-full">
                              <div class="action-btns-container" id="actions-img${i}">
                                <button type="button" class="btn btn-light btn-sm border" onclick="viewFullScreen(${i}, event)"><i class="bi bi-eye"></i></button>
                                <button type="button" class="btn btn-danger btn-sm" onclick="clearImage(event, ${i})"><i class="bi bi-x"></i></button>
                              </div>
                            </div>
                            <input type="file" name="img${i}" id="file-img${i}" accept="image/*" onchange="handlePreview(this, ${i})" style="display: none;">
                          </div>
                        `);
                      }
                    </script>
                  </div>
                </div>
              </div>
            </div>
            <div class="modal-footer bg-light">
              <button
                type="button"
                class="btn btn-light"
                data-bs-dismiss="modal">
                Batal
              </button>
              <button type="submit" class="btn btn-primary px-4">
                Simpan Perubahan
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

    <script>
      const WORKER_URL = "https://d1-rest.bayuanggara-bp.workers.dev";
      let quillTitle, quillDeskripsi, quillFitur, myModal;

      document.addEventListener("DOMContentLoaded", () => {
        myModal = new bootstrap.Modal(document.getElementById("projekModal"));
        const qConfig = {
          theme: "snow",
          modules: {
            toolbar: [
              ["bold", "italic"],
              [{ list: "ordered" }, { list: "bullet" }],
            ],
          },
        };
        quillTitle = new Quill("#editor-title", qConfig);
        quillDeskripsi = new Quill("#editor-deskripsi", qConfig);
        quillFitur = new Quill("#editor-fitur", qConfig);

        loadData();
        document.getElementById("projekForm").onsubmit = handleFormSubmit;
      });

      // --- DATABASE HANDLER ---
      async function runQuery(sql, params = []) {
        try {
          const res = await fetch(WORKER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sql, params }),
          });
          const json = await res.json();
          return json.success ? json.results : null;
        } catch (e) {
          console.error("Query Error:", e);
          return null;
        }
      }

      // Helper: Ubah Buffer/Array ke Base64 untuk tampilan
      function arrayBufferToBase64(buffer) {
        if (!buffer) return null;
        // D1 mengembalikan BLOB sebagai objek {data: [...]} atau array langsung
        let bytes = new Uint8Array(buffer.data || buffer);
        let binary = "";
        for (let i = 0; i < bytes.byteLength; i++)
          binary += String.fromCharCode(bytes[i]);
        return btoa(binary);
      }

      // Helper: Ubah File Upload ke Array Byte agar kompatibel dengan BLOB D1
      async function fileToByteArray(file) {
        return new Promise((resolve, reject) => {
          if (!file || !(file instanceof File)) return resolve(null);
          const reader = new FileReader();
          reader.onload = () => {
            const uint8 = new Uint8Array(reader.result);
            resolve(Array.from(uint8));
          };
          reader.onerror = reject;
          reader.readAsArrayBuffer(file);
        });
      }

      // --- CRUD OPERATIONS ---
      async function loadData() {
        const results = await runQuery("SELECT * FROM projek ORDER BY id DESC");
        const tbody = document.getElementById("tableBody");
        if (!results || results.length === 0) {
          tbody.innerHTML = `<tr><td colspan="8" class="text-center p-5 text-muted">Belum ada data projek.</td></tr>`;
          return;
        }
        tbody.innerHTML = results
          .map((item, index) => {
            const techs = JSON.parse(item.teknologi || "[]");
            const b64 = arrayBufferToBase64(item.img1);
            return `
        <tr>
          <td class="ps-4 text-muted small">${index + 1}</td>
          <td class="fw-bold text-primary">${item.nm_projek}</td>
          <td class="small text-muted">${item.tahun || "-"}</td>
          <td><div class="small text-truncate" style="max-width:150px">${(item.title || "").replace(/<[^>]*>?/gm, "")}</div></td>
          <td>${techs.map((t) => `<span class="badge bg-light text-dark border me-1 small">${t}</span>`).join("")}</td>
          <td>
            <div class="d-flex gap-1">
                ${item.link ? `<a href="${item.link}" target="_blank" class="btn btn-sm btn-outline-secondary"><i class="bi bi-globe"></i></a>` : ""}
                ${item.youtube ? `<a href="https://youtube.com/watch?v=${item.youtube}" target="_blank" class="btn btn-sm btn-outline-danger"><i class="bi bi-youtube"></i></a>` : ""}
            </div>
          </td>
          <td>${b64 ? `<img src="data:image/jpeg;base64,${b64}" class="rounded border shadow-sm" style="width:40px;height:40px;object-fit:cover;cursor:pointer" onclick="showGallery(${item.id})">` : "-"}</td>
          <td class="text-center">
            <div class="btn-group">
              <button class="btn btn-sm btn-outline-primary" onclick="editItem(${item.id})"><i class="bi bi-pencil"></i></button>
              <button class="btn btn-sm btn-outline-danger" onclick="deleteItem(${item.id})"><i class="bi bi-trash"></i></button>
            </div>
          </td>
        </tr>`;
          })
          .join("");
      }

      async function handleFormSubmit(e) {
        e.preventDefault();
        Swal.fire({
          title: "Menyimpan...",
          allowOutsideClick: false,
          didOpen: () => Swal.showLoading(),
        });

        const form = e.target;
        const id = document.getElementById("projekId").value;
        const teknologi = JSON.stringify(
          Array.from(document.querySelectorAll(".tech-input")).map(
            (i) => i.value,
          ),
        );

        // Proses semua file gambar menjadi Byte Array
        const imgBlobs = [];
        for (let i = 1; i <= 5; i++) {
          const fileInput = document.getElementById(`file-img${i}`);
          imgBlobs[i] = await fileToByteArray(fileInput.files[0]);
        }

        let sql, params;
        if (id) {
          // UPDATE DATA
          sql = `UPDATE projek SET nm_projek=?, tahun=?, title=?, deskripsi=?, fitur=?, link=?, youtube=?, teknologi=?`;
          params = [
            form.nm_projek.value,
            form.tahun.value,
            quillTitle.root.innerHTML,
            quillDeskripsi.root.innerHTML,
            quillFitur.root.innerHTML,
            form.link.value,
            form.youtube.value,
            teknologi,
          ];

          // Update BLOB hanya jika ada file baru yang dipilih
          for (let i = 1; i <= 5; i++) {
            if (imgBlobs[i]) {
              sql += `, img${i}=?`;
              params.push(imgBlobs[i]);
            }
          }
          sql += ` WHERE id=?`;
          params.push(id);
        } else {
          // INSERT DATA
          sql = `INSERT INTO projek (nm_projek, tahun, title, deskripsi, fitur, link, youtube, teknologi, img1, img2, img3, img4, img5) VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?)`;
          params = [
            form.nm_projek.value,
            form.tahun.value,
            quillTitle.root.innerHTML,
            quillDeskripsi.root.innerHTML,
            quillFitur.root.innerHTML,
            form.link.value,
            form.youtube.value,
            teknologi,
            imgBlobs[1],
            imgBlobs[2],
            imgBlobs[3],
            imgBlobs[4],
            imgBlobs[5],
          ];
        }

        const success = await runQuery(sql, params);
        if (success) {
          Swal.fire(
            "Berhasil",
            "Data telah sinkron dengan database",
            "success",
          );
          myModal.hide();
          loadData();
        } else {
          Swal.fire("Gagal", "Terjadi kesalahan saat menyimpan data", "error");
        }
      }

      async function editItem(id) {
        const res = await runQuery("SELECT * FROM projek WHERE id = ?", [id]);
        if (!res || res.length === 0) return;
        const d = res[0];

        openModal(); // Reset form & buka modal
        document.getElementById("projekId").value = d.id;
        document.getElementById("projekForm").nm_projek.value = d.nm_projek;
        document.getElementById("projekForm").tahun.value = d.tahun || "";
        quillTitle.root.innerHTML = d.title || "";
        quillDeskripsi.root.innerHTML = d.deskripsi || "";
        quillFitur.root.innerHTML = d.fitur || "";
        document.getElementById("projekForm").link.value = d.link || "";
        document.getElementById("projekForm").youtube.value = d.youtube || "";

        document.getElementById("tech-container").innerHTML = "";
        const techs = JSON.parse(d.teknologi || "[]");
        if (techs.length > 0) techs.forEach((t) => addTechField(t));
        else addTechField();

        for (let i = 1; i <= 5; i++) {
          const b64 = arrayBufferToBase64(d[`img${i}`]);
          if (b64) {
            const img = document.getElementById(`prev-img${i}`);
            img.src = `data:image/jpeg;base64,${b64}`;
            img.style.display = "block";
            document.getElementById(`actions-img${i}`).style.display = "flex";
            document.querySelector(
              `#box-img${i} .placeholder-icon`,
            ).style.display = "none";
          }
        }
      }

      async function deleteItem(id) {
        const result = await Swal.fire({
          title: "Hapus projek?",
          text: "Data yang dihapus tidak bisa dikembalikan!",
          icon: "warning",
          showCancelButton: true,
          confirmButtonColor: "#d33",
          confirmButtonText: "Ya, Hapus!",
        });

        if (result.isConfirmed) {
          await runQuery("DELETE FROM projek WHERE id = ?", [id]);
          loadData();
        }
      }

      // --- UI HELPERS (GALERI & PREVIEW) ---
      async function showGallery(id) {
        const res = await runQuery("SELECT * FROM projek WHERE id = ?", [id]);
        if (!res || res.length === 0) return;
        const d = res[0];
        const imgs = [];
        for (let i = 1; i <= 5; i++) {
          const b64 = arrayBufferToBase64(d[`img${i}`]);
          if (b64) imgs.push(`data:image/jpeg;base64,${b64}`);
        }
        if (imgs.length === 0)
          return Swal.fire("Info", "Tidak ada gambar", "info");

        Swal.fire({
          title: d.nm_projek,
          width: "800px",
          showConfirmButton: false,
          showCloseButton: true,
          html: `
        <div class="mb-3 bg-light rounded p-2 border"><img id="gal-main" src="${imgs[0]}" class="img-fluid rounded" style="max-height:450px;object-fit:contain"></div>
        <div class="d-flex justify-content-center gap-2 overflow-auto p-2">
          ${imgs.map((s, i) => `<img src="${s}" class="thumb-img rounded border ${i == 0 ? "active" : ""}" style="width:60px;height:45px;object-fit:cover;cursor:pointer" onclick="document.getElementById('gal-main').src=this.src; document.querySelectorAll('.thumb-img').forEach(t=>t.classList.remove('active')); this.classList.add('active')">`).join("")}
        </div>`,
        });
      }

      function triggerFileInput(idx) {
        if (document.getElementById(`prev-img${idx}`).style.display !== "block")
          document.getElementById(`file-img${idx}`).click();
      }

      function handlePreview(input, idx) {
        if (input.files && input.files[0]) {
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = document.getElementById(`prev-img${idx}`);
            img.src = e.target.result;
            img.style.display = "block";
            document.getElementById(`actions-img${idx}`).style.display = "flex";
            document.querySelector(
              `#box-img${idx} .placeholder-icon`,
            ).style.display = "none";
          };
          reader.readAsDataURL(input.files[0]);
        }
      }

      function clearImage(e, idx) {
        if (e) e.stopPropagation();
        document.getElementById(`file-img${idx}`).value = "";
        const img = document.getElementById(`prev-img${idx}`);
        img.style.display = "none";
        img.src = "";
        document.getElementById(`actions-img${idx}`).style.display = "none";
        document.querySelector(
          `#box-img${idx} .placeholder-icon`,
        ).style.display = "block";
      }

      function addTechField(val = "") {
        const div = document.createElement("div");
        div.className = "col-6";
        div.innerHTML = `<div class="input-group input-group-sm"><input type="text" class="form-control tech-input" value="${val}" required><button class="btn btn-outline-danger" type="button" onclick="this.closest('.col-6').remove()"><i class="bi bi-x"></i></button></div>`;
        document.getElementById("tech-container").appendChild(div);
      }

      function openModal() {
        document.getElementById("projekForm").reset();
        document.getElementById("projekId").value = "";
        quillTitle.root.innerHTML = "";
        quillDeskripsi.root.innerHTML = "";
        quillFitur.root.innerHTML = "";
        document.getElementById("tech-container").innerHTML = "";
        for (let i = 1; i <= 5; i++) clearImage(null, i);
        addTechField();
        myModal.show();
      }

      function filterTable() {
        const input = document
          .getElementById("searchInput")
          .value.toUpperCase();
        const rows = document
          .getElementById("tableBody")
          .getElementsByTagName("tr");
        for (let i = 0; i < rows.length; i++) {
          const td = rows[i].getElementsByTagName("td")[1];
          if (td)
            rows[i].style.display = td.textContent.toUpperCase().includes(input)
              ? ""
              : "none";
        }
      }
    </script>
  </body>
</html>
