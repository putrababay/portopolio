<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel - Portofolio Bayu</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.quilljs.com/1.3.6/quill.snow.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />

    <style>
      body {
        background-color: #f4f7f6;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      .card {
        border: none;
        border-radius: 12px;
      }
      .ql-container {
        height: 150px;
        border-bottom-left-radius: 8px;
        border-bottom-right-radius: 8px;
      }
      .ql-toolbar {
        border-top-left-radius: 8px;
        border-top-right-radius: 8px;
      }

      /* Image Preview Style */
      .img-preview-wrapper {
        position: relative;
        width: 100%;
        padding-top: 100%;
        background: #e9ecef;
        border-radius: 8px;
        overflow: hidden;
        border: 2px dashed #dee2e6;
        transition: all 0.3s;
      }
      .img-preview-wrapper:hover {
        border-color: #0d6efd;
      }
      .img-preview-wrapper img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: none;
      }
      .img-preview-wrapper .placeholder-icon {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #adb5bd;
        font-size: 1.2rem;
      }
      .table-img {
        width: 60px;
        height: 60px;
        object-fit: cover;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div class="container py-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="fw-bold mb-0">Project Console</h2>
          <small class="text-muted">Kelola data portofolio D1 Cloudflare</small>
        </div>
        <button class="btn btn-primary px-4 shadow-sm" onclick="openModal()">
          <i class="bi bi-plus-lg me-2"></i>Tambah Projek
        </button>
      </div>

      <div class="card shadow-sm">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="bg-light">
                <tr>
                  <th class="ps-4">Projek</th>
                  <th>Gambar Utama</th>
                  <th>Teknologi</th>
                  <th class="text-center">Aksi</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="projekModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-xl">
        <div class="modal-content">
          <form id="projekForm">
            <div class="modal-header border-0">
              <h5 class="modal-title fw-bold" id="modalTitle">
                Konfigurasi Projek
              </h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <input type="hidden" name="id" id="projekId" />

              <div class="row">
                <div class="col-lg-8">
                  <div class="mb-3">
                    <label class="form-label fw-semibold">Nama Projek</label>
                    <input
                      type="text"
                      name="nm_projek"
                      class="form-control"
                      placeholder="Input nama projek..."
                      required
                    />
                  </div>

                  <div class="mb-3">
                    <label class="form-label fw-semibold"
                      >Title (Short Intro)</label
                    >
                    <div id="editor-title"></div>
                  </div>

                  <div class="row">
                    <div class="col-md-6 mb-3">
                      <label class="form-label fw-semibold">Deskripsi</label>
                      <div id="editor-deskripsi"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                      <label class="form-label fw-semibold">Fitur Utama</label>
                      <div id="editor-fitur"></div>
                    </div>
                  </div>

                  <div class="mb-3">
                    <label
                      class="form-label fw-semibold d-flex justify-content-between"
                    >
                      Teknologi Stack
                      <button
                        type="button"
                        class="btn btn-sm btn-outline-primary border-0"
                        onclick="addTechField()"
                      >
                        <i class="bi bi-plus-circle"></i> Tambah
                      </button>
                    </label>
                    <div id="tech-container" class="row row-cols-2 g-2"></div>
                  </div>
                </div>

                <div class="col-lg-4 bg-light p-3 rounded">
                  <div class="mb-3">
                    <label class="form-label fw-semibold">Link Demo</label>
                    <input
                      type="url"
                      name="link"
                      class="form-control mb-2"
                      placeholder="https://..."
                    />
                    <label class="form-label fw-semibold">Link YouTube</label>
                    <input
                      type="text"
                      name="youtube"
                      class="form-control"
                      placeholder="ID Video / URL"
                    />
                  </div>

                  <label class="form-label fw-semibold"
                    >Gallery Images (Blob)</label
                  >
                  <div class="row row-cols-3 g-2">
                    <script>
                      for (let i = 1; i <= 5; i++) {
                        document.write(`
                                            <div class="col">
                                                <div class="img-preview-wrapper" id="wrapper-img${i}">
                                                    <i class="bi bi-camera placeholder-icon"></i>
                                                    <img id="prev-img${i}" src="" alt="preview">
                                                </div>
                                                <input type="file" name="img${i}" class="d-none" id="file-img${i}" accept="image/*" onchange="previewImage(this, 'img${i}')">
                                                <button type="button" class="btn btn-sm btn-dark w-100 mt-1" onclick="document.getElementById('file-img${i}').click()">Img ${i}</button>
                                            </div>
                                        `);
                      }
                    </script>
                  </div>
                </div>
              </div>
            </div>
            <div class="modal-footer border-0">
              <button
                type="button"
                class="btn btn-light"
                data-bs-dismiss="modal"
              >
                Batal
              </button>
              <button type="submit" class="btn btn-primary px-4">
                Simpan Projek
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

    <script>
      // --- CONFIGURATION ---
      const WORKER_URL = "https://d1-rest.bayuanggara-bp.workers.dev";

      // --- GLOBAL STATE ---
      let quillTitle, quillDeskripsi, quillFitur, myModal;

      // --- INITIALIZATION ---
      document.addEventListener("DOMContentLoaded", function () {
        // Init Bootstrap Modal
        const modalEl = document.getElementById("projekModal");
        if (modalEl) myModal = new bootstrap.Modal(modalEl);

        // Init Quill Editors
        const qConfig = {
          theme: "snow",
          modules: {
            toolbar: [
              ["bold", "italic"],
              [{ list: "ordered" }, { list: "bullet" }],
            ],
          },
        };
        quillTitle = new Quill("#editor-title", qConfig);
        quillDeskripsi = new Quill("#editor-deskripsi", qConfig);
        quillFitur = new Quill("#editor-fitur", qConfig);

        // Load Data awal
        loadData();

        // Event Listener Form
        document
          .getElementById("projekForm")
          .addEventListener("submit", handleFormSubmit);
      });

      // --- ENGINE FETCH API (Universal Query) ---
      async function runQuery(sqlQuery, params = []) {
        try {
          const response = await fetch(WORKER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              sql: sqlQuery,
              params: params,
            }),
          });

          if (!response.ok) {
            const errorBody = await response.json().catch(() => ({}));
            throw new Error(errorBody.error || `HTTP Error ${response.status}`);
          }

          const json = await response.json();

          // Mengikuti struktur D1 Native (json.results)
          if (json.success && json.results) {
            return json.results;
          }
          return [];
        } catch (e) {
          console.error("Gagal koneksi ke Worker:", e);
          Swal.fire("Database Error", e.message, "error");
          return [];
        }
      }

      // --- CRUD OPERATIONS ---

      // 1. READ
      async function loadData() {
        // Kita ambil id, nama, teknologi, dan img1 untuk daftar tabel
        const sql =
          "SELECT id, nm_projek, teknologi, img1 FROM projek ORDER BY id DESC";
        const results = await runQuery(sql);

        const tbody = document.getElementById("tableBody");
        if (!results.length) {
          tbody.innerHTML =
            '<tr><td colspan="4" class="text-center py-4 text-muted">Belum ada data.</td></tr>';
          return;
        }

        tbody.innerHTML = results
          .map((item) => {
            let techs = [];
            try {
              techs = JSON.parse(item.teknologi || "[]");
            } catch (e) {
              techs = [];
            }

            // Konversi Array Buffer (dari D1) kembali ke Base64 untuk preview di tabel
            let imgTag = '<span class="text-muted small">No Image</span>';
            if (item.img1) {
              const base64 = btoa(
                String.fromCharCode(...new Uint8Array(item.img1)),
              );
              imgTag = `<img src="data:image/jpeg;base64,${base64}" class="table-img" style="width:50px; height:50px; object-fit:cover; border-radius:5px;">`;
            }

            return `
        <tr>
            <td class="ps-4 fw-bold">${item.nm_projek}</td>
            <td>${imgTag}</td>
            <td>${techs.map((t) => `<span class="badge bg-light text-dark border me-1">${t}</span>`).join("")}</td>
            <td class="text-center">
                <button class="btn btn-sm btn-outline-danger" onclick="deleteItem(${item.id})">
                    <i class="bi bi-trash"></i>
                </button>
            </td>
        </tr>`;
          })
          .join("");
      }

      // 2. CREATE
      async function handleFormSubmit(e) {
        e.preventDefault();

        Swal.fire({
          title: "Menyimpan Data...",
          allowOutsideClick: false,
          didOpen: () => Swal.showLoading(),
        });

        const formData = new FormData(e.target);

        // Helper: Convert File Upload ke Array (agar bisa masuk JSON body)
        const fileToBuffer = async (file) => {
          if (!file || file.size === 0) return null;
          const arrayBuffer = await file.arrayBuffer();
          return Array.from(new Uint8Array(arrayBuffer));
        };

        // Ambil Values
        const nm = formData.get("nm_projek");
        const title = quillTitle.root.innerHTML;
        const desk = quillDeskripsi.root.innerHTML;
        const fit = quillFitur.root.innerHTML;
        const link = formData.get("link");
        const yt = formData.get("youtube");

        // Teknologi Stack (Simpan sebagai JSON string)
        const techInputs = document.querySelectorAll(".tech-input");
        const teknologi = JSON.stringify(
          Array.from(techInputs)
            .map((i) => i.value)
            .filter((v) => v),
        );

        // Ambil Gambar (Parallel)
        const [i1, i2, i3, i4, i5] = await Promise.all([
          fileToBuffer(formData.get("img1")),
          fileToBuffer(formData.get("img2")),
          fileToBuffer(formData.get("img3")),
          fileToBuffer(formData.get("img4")),
          fileToBuffer(formData.get("img5")),
        ]);

        const sql = `INSERT INTO projek (nm_projek, title, deskripsi, fitur, teknologi, link, youtube, img1, img2, img3, img4, img5) 
                 VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`;

        const params = [
          nm,
          title,
          desk,
          fit,
          teknologi,
          link,
          yt,
          i1,
          i2,
          i3,
          i4,
          i5,
        ];

        const success = await runQuery(sql, params);

        if (success) {
          await Swal.fire(
            "Berhasil!",
            "Projek baru telah ditambahkan.",
            "success",
          );
          myModal.hide();
          loadData();
        }
      }

      // 3. DELETE
      async function deleteItem(id) {
        const result = await Swal.fire({
          title: "Hapus Projek?",
          text: "Data akan dihapus permanen dari D1 SQLite.",
          icon: "warning",
          showCancelButton: true,
          confirmButtonColor: "#d33",
          confirmButtonText: "Ya, Hapus!",
        });

        if (result.isConfirmed) {
          const del = await runQuery("DELETE FROM projek WHERE id = ?", [id]);
          if (del) {
            Swal.fire("Dihapus!", "Data telah dibersihkan.", "success");
            loadData();
          }
        }
      }

      // --- UI HELPERS ---

      function openModal() {
        const form = document.getElementById("projekForm");
        form.reset();
        document.getElementById("projekId").value = "";

        // Reset Quill
        quillTitle.setContents([]);
        quillDeskripsi.setContents([]);
        quillFitur.setContents([]);

        // Reset Tech Container
        document.getElementById("tech-container").innerHTML = "";
        addTechField("PHP"); // Default field

        // Reset Image Previews (jika ada fungsi resetPreviews)
        if (typeof resetPreviews === "function") resetPreviews();

        myModal.show();
      }

      function addTechField(value = "") {
        const container = document.getElementById("tech-container");
        const div = document.createElement("div");
        div.className = "col";
        div.innerHTML = `
        <div class="input-group">
            <input type="text" class="form-control form-control-sm tech-input" value="${value}" placeholder="Teknologi">
            <button class="btn btn-outline-danger btn-sm" type="button" onclick="this.closest('.col').remove()">-</button>
        </div>
    `;
        container.appendChild(div);
      }

      // Preview Image Handler
      function previewImage(input, targetId) {
        const preview = document.getElementById(`prev-${targetId}`);
        const placeholder = document.querySelector(
          `#wrapper-${targetId} .placeholder-icon`,
        );

        if (input.files && input.files[0]) {
          const reader = new FileReader();
          reader.onload = (e) => {
            preview.src = e.target.result;
            preview.style.display = "block";
            if (placeholder) placeholder.style.display = "none";
          };
          reader.readAsDataURL(input.files[0]);
        }
      }

      function resetPreviews() {
        for (let i = 1; i <= 5; i++) {
          const img = document.getElementById(`prev-img${i}`);
          const icon = document.querySelector(
            `#wrapper-img${i} .placeholder-icon`,
          );
          if (img) {
            img.src = "";
            img.style.display = "none";
          }
          if (icon) icon.style.display = "block";
        }
      }
    </script>
  </body>
</html>
